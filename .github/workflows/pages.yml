name: Deploy Pages

# Publishes the landing page at foredogs.nichtlegacy.com. The page prints the
# integration's version, so a release (which bumps manifest.json) redeploys it
# too.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'tools/build_site.sh'
      - 'custom_components/foredogs/manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins: the page is a snapshot of the branch, so
# an in-flight older build has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: bash tools/build_site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
